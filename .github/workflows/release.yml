name: Release

on: workflow_dispatch
permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  pages: write # to deploy to Pages
  id-token: write # to verify the deployment originates from an appropriate source
  deployments: write
  statuses: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # get all tags for semantic release
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libkrb5-dev libxkbfile-dev libx11-6 pkg-config
          # mise installer from the v2026.11.12 release, checked before it runs.
          # To update mise, change the version and the checksum of that release's install.sh.
          curl -fsSL -o "$RUNNER_TEMP/mise-install.sh" https://github.com/jdx/mise/releases/download/v2026.11.12/install.sh
          echo "4a0508efdaf9d2e58a0c0b2fe5b4c87af6da2976d1b5abb5f3feb9a1c1874ebf  $RUNNER_TEMP/mise-install.sh" | sha256sum -c -
          MISE_VERSION=v2026.11.12 sh "$RUNNER_TEMP/mise-install.sh"
          echo "$HOME/.local/share/mise/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          mise install -E vscode
          mise install
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - name: Install demo dependencies
        working-directory: ./demo
        run: npm ci
      - name: Build demo
        working-directory: ./demo
        run: npm run build:netlify
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './demo/dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: ${{ github.event.pull_request.title }}
          netlify-config-path: ./demo/netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1
